
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown to 16:30</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0b1020;
      --bg-2: #1a1f3a;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #eef1ff;
      --muted: #9aa3c7;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --done: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 600px at 15% 10%, rgba(124, 92, 255, 0.25), transparent 60%),
        radial-gradient(800px 600px at 85% 90%, rgba(0, 212, 255, 0.18), transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 820px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7);
      animation: pulse 1.6s infinite;
    }

    h1 {
      margin: 20px 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 span {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub { color: var(--muted); font-size: 15px; }

    .timer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2.5vw, 20px);
      margin: 36px 0 28px;
    }

    .unit {
      padding: clamp(18px, 4vw, 32px) 8px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .num {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 700;
      font-size: clamp(44px, 12vw, 104px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(11px, 2.4vw, 13px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      transition: width 0.9s linear;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .done .num { color: var(--done); }
    .done .bar { background: var(--done); }
    .done .dot { background: var(--done); animation: none; }

    .done-msg {
      display: none;
      margin-top: 28px;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
      color: var(--done);
    }
    .done .done-msg { display: block; animation: pop 0.5s ease-out; }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(0, 212, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
    }
    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot, .done .done-msg { animation: none; }
      .bar { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap" id="app">
    <div class="eyebrow"><span class="dot"></span><span id="now">--:--:--</span></div>

    <h1>Counting down to <span id="targetLabel">16:30</span></h1>
    <p class="sub" id="dateLabel">&nbsp;</p>

    <section class="timer" aria-live="polite">
      <div class="unit"><div class="num" id="h">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="s">00</div><div class="label">Seconds</div></div>
    </section>

    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="meta"><span id="startLabel">Start</span><span id="pct">0%</span></div>

    <div class="done-msg">⏰ It's 16:30 — time's up!</div>
  </main>

  <script>
    // Target time: 16:30 by default. Override with ?t=HH:MM, e.g. index.html?t=09:15
    const params = new URLSearchParams(location.search);
    const raw = /^\d{1,2}:\d{2}$/.test(params.get("t") || "") ? params.get("t") : "16:30";
    const [th, tm] = raw.split(":").map(Number);

    const pageOpened = new Date();
    const target = new Date(pageOpened);
    target.setHours(th, tm, 0, 0);

    const pad = n => String(n).padStart(2, "0");
    const fmt = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const $ = id => document.getElementById(id);

    $("targetLabel").textContent = fmt(target);
    document.title = `Countdown to ${fmt(target)}`;
    document.querySelector(".done-msg").textContent = `⏰ It's ${fmt(target)} — time's up!`;
    $("dateLabel").textContent = target.toLocaleDateString(undefined, {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
    $("startLabel").textContent = `Opened ${fmt(pageOpened)}`;

    const total = Math.max(target - pageOpened, 1);

    function tick() {
      const now = new Date();
      $("now").textContent = now.toLocaleTimeString(undefined, { hour12: false });

      let diff = target - now;
      if (diff <= 0) {
        diff = 0;
        $("app").classList.add("done");
      }

      const secs = Math.floor(diff / 1000);
      $("h").textContent = pad(Math.floor(secs / 3600));
      $("m").textContent = pad(Math.floor((secs % 3600) / 60));
      $("s").textContent = pad(secs % 60);

      const pct = Math.min(100, ((total - diff) / total) * 100);
      $("bar").style.width = pct + "%";
      $("pct").textContent = Math.floor(pct) + "%";

      if (diff === 0) return;
      setTimeout(tick, 1000 - (Date.now() % 1000)); // align to the second
    }

    tick();
  </script>
</body>
</html>
